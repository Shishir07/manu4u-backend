# Production profile
# All secrets via environment variables — no defaults, no fallbacks
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD,
#                    API_FOOTBALL_KEY, OPENAI_API_KEY,
#                    QDRANT_HOST, QDRANT_PORT

manu4u:
  guest-api-key: ${MANU4U_GUEST_API_KEY}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

logging:
  level:
    root: WARN
    com.manu4u: INFO
